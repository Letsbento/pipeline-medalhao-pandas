name: pipeline-aula
services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    mem_limit: 512m

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: serving
    ports: ["${PG_PORT}:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d serving"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m

  metabase:
    image: metabase/metabase:v0.55.14.2
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      JAVA_OPTS: "-Xmx768m"
    ports: ["3000:3000"]
    volumes: [metabase_data:/metabase-data]
    mem_limit: 1g

volumes:
  minio_data:
  pg_data:
  metabase_data:
